<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pulsekit</title>
<script src="https://artifactcdn.diabrowser.engineering/ajax/libs/Chart.js/chart.umd.js"></script>
<style>
:root {
  --bg: #f2f1f6;
  --card: #ffffff;
  --text: #1c1c1e;
  --text2: #8e8e93;
  --text3: #aeaeb2;
  --sep: rgba(60,60,67,0.06);
  --blue: #007aff;
  --red: #ff3b30;
  --orange: #ff9500;
  --green: #34c759;
  --purple: #af52de;
  --pink: #ff2d55;
  --teal: #5ac8fa;
  --yellow: #ffcc00;
  --indigo: #5856d6;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --r: 16px;
  --nav-h: 64px;
}

[data-theme="dark"] {
  --bg: #000000;
  --card: #1c1c1e;
  --text: #ffffff;
  --text2: #98989f;
  --text3: #636366;
  --sep: rgba(255,255,255,0.08);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:var(--font); background:var(--bg); color:var(--text); max-width:430px; margin:0 auto; min-height:100vh; min-height:100dvh; overflow-x:hidden; -webkit-font-smoothing:antialiased; }

/* Screens */
.screen { display:none; padding:0 20px 100px; animation:fadeIn .25s ease; }
.screen.active { display:block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* Bottom Nav */
.bottom-nav {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px;
  background:var(--card); border-top:1px solid var(--sep);
  display:flex; padding:6px 0 calc(6px + var(--safe-b));
  z-index:90;
}
.nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:6px 0; border:none; background:none; color:var(--text3);
  font-size:10px; font-weight:600; font-family:var(--font); cursor:pointer;
  transition:color .15s;
}
.nav-item.active { color:var(--blue); }
.nav-icon { font-size:22px; height:26px; display:flex; align-items:center; justify-content:center; }

/* Common */
.section-title { font-size:22px; font-weight:700; margin:16px 0 12px; }
.card { background:var(--card); border-radius:var(--r); padding:16px; margin-bottom:10px; }
.row { display:flex; align-items:center; gap:10px; }
.chip { padding:5px 12px; border-radius:100px; font-size:12px; font-weight:600; border:none; cursor:pointer; font-family:var(--font); transition:all .15s; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:100px; font-size:11px; font-weight:650; }

/* ===== DASHBOARD ===== */
.greeting { padding:52px 0 4px; }
.greeting h1 { font-size:28px; font-weight:700; }
.greeting p { font-size:14px; color:var(--text2); margin-top:2px; }

.level-bar { margin:16px 0 8px; }
.level-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.level-label { font-size:13px; font-weight:650; }
.level-xp { font-size:12px; color:var(--text2); font-weight:600; }
.xp-bar { height:8px; background:var(--sep); border-radius:4px; overflow:hidden; }
.xp-fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--purple)); border-radius:4px; transition:width .5s ease; }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.stat-box { background:var(--card); border-radius:var(--r); padding:14px; }
.stat-val { font-size:26px; font-weight:700; }
.stat-lbl { font-size:11px; color:var(--text2); font-weight:600; text-transform:uppercase; letter-spacing:.3px; margin-top:2px; }

.streak-card { display:flex; align-items:center; gap:14px; background:linear-gradient(135deg,#ff9500,#ff2d55); border-radius:var(--r); padding:16px; margin-bottom:10px; color:#fff; }
.streak-num { font-size:36px; font-weight:800; }
.streak-text { font-size:14px; font-weight:600; opacity:.9; }
.streak-sub { font-size:11px; opacity:.7; }

.quick-tasks .qt-item {
  display:flex; align-items:center; gap:12px; padding:12px 0;
  border-bottom:1px solid var(--sep);
}
.quick-tasks .qt-item:last-child { border:none; }
.qt-check { width:22px; height:22px; border-radius:50%; border:2px solid var(--text3); cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .2s; }
.qt-check.done { border-color:var(--green); background:var(--green); }
.qt-check.done::after { content:'✓'; color:#fff; font-size:12px; font-weight:700; }
.qt-title { font-size:15px; font-weight:500; flex:1; }
.qt-title.done-text { text-decoration:line-through; color:var(--text3); }
.qt-pri { width:4px; height:20px; border-radius:2px; flex-shrink:0; }

.achievements { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.achievements::-webkit-scrollbar { display:none; }
.ach-badge { min-width:72px; text-align:center; padding:12px 8px; background:var(--card); border-radius:14px; }
.ach-icon { font-size:28px; }
.ach-name { font-size:10px; font-weight:600; color:var(--text2); margin-top:4px; }
.ach-badge.locked { opacity:.35; }

/* ===== TASKS ===== */
.task-filters { display:flex; gap:0; background:rgba(118,118,128,.12); border-radius:10px; padding:2px; margin-bottom:12px; }
.tf-btn { flex:1; padding:7px; font-size:13px; font-weight:600; font-family:var(--font); border:none; border-radius:8px; background:none; color:var(--text2); cursor:pointer; transition:all .18s; }
.tf-btn.active { background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); }

.task-item { background:var(--card); border-radius:14px; padding:14px; margin-bottom:8px; display:flex; align-items:flex-start; gap:12px; transition:all .2s; }
.task-item.completed .t-title { text-decoration:line-through; color:var(--text3); }
.t-check { width:24px; height:24px; border-radius:50%; border:2px solid var(--text3); flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; margin-top:1px; }
.t-check.done { border-color:var(--green); background:var(--green); }
.t-check.done::after { content:'✓'; color:#fff; font-size:13px; font-weight:700; }
.t-body { flex:1; min-width:0; }
.t-title { font-size:15px; font-weight:500; line-height:1.35; }
.t-notes { font-size:12px; color:var(--text2); margin-top:3px; }
.t-meta { display:flex; align-items:center; gap:6px; margin-top:6px; flex-wrap:wrap; }
.t-cat { font-size:10px; font-weight:650; padding:2px 8px; border-radius:100px; color:#fff; }
.t-due { font-size:11px; color:var(--text2); }
.t-due.overdue { color:var(--red); font-weight:600; }
.t-pri-bar { width:4px; border-radius:2px; align-self:stretch; min-height:28px; flex-shrink:0; }
.t-del { border:none; background:none; color:var(--text3); font-size:16px; cursor:pointer; padding:4px; flex-shrink:0; }

.subtasks { margin-top:8px; padding-left:4px; }
.sub-item { display:flex; align-items:center; gap:8px; padding:4px 0; }
.sub-check { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--text3); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:9px; transition:all .15s; }
.sub-check.done { background:var(--green); border-color:var(--green); color:#fff; }
.sub-check.done::after { content:'✓'; }
.sub-title { font-size:13px; color:var(--text2); }
.sub-title.done-t { text-decoration:line-through; color:var(--text3); }

.fab { position:fixed; bottom:calc(76px + var(--safe-b)); right:calc(50% - 195px); width:52px; height:52px; border-radius:50%; background:var(--blue); color:#fff; border:none; font-size:26px; font-weight:300; cursor:pointer; box-shadow:0 4px 16px rgba(0,122,255,.35); z-index:80; display:flex; align-items:center; justify-content:center; transition:transform .15s; }
@media(max-width:430px){ .fab{right:20px} }
.fab:active { transform:scale(.88); }

/* ===== FOCUS ===== */
.timer-ring { width:240px; height:240px; margin:32px auto 24px; position:relative; }
.timer-ring svg { width:100%; height:100%; transform:rotate(-90deg); }
.timer-ring circle { fill:none; stroke-width:8; stroke-linecap:round; }
.timer-bg { stroke:var(--sep); }
.timer-fg { stroke:var(--red); transition:stroke-dashoffset .5s linear; }
.timer-text { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.timer-time { font-size:48px; font-weight:700; font-variant-numeric:tabular-nums; }
.timer-label { font-size:14px; color:var(--text2); font-weight:600; margin-top:4px; }
.timer-controls { display:flex; gap:12px; justify-content:center; margin-bottom:24px; }
.timer-btn { padding:12px 32px; border-radius:100px; border:none; font-size:16px; font-weight:600; font-family:var(--font); cursor:pointer; transition:all .15s; }
.timer-btn:active { transform:scale(.95); }
.timer-btn.primary { background:var(--green); color:#fff; }
.timer-btn.secondary { background:rgba(118,118,128,.12); color:var(--text); }
.timer-btn.danger { background:var(--red); color:#fff; }
.timer-modes { display:flex; gap:0; background:rgba(118,118,128,.12); border-radius:10px; padding:2px; margin:0 auto 24px; max-width:320px; }
.tm-btn { flex:1; padding:8px; font-size:13px; font-weight:600; font-family:var(--font); border:none; border-radius:8px; background:none; color:var(--text2); cursor:pointer; }
.tm-btn.active { background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.focus-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }

/* ===== HABITS ===== */
.habit-item { background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:8px; }
.habit-top { display:flex; align-items:center; justify-content:space-between; }
.habit-info { display:flex; align-items:center; gap:10px; }
.habit-icon { font-size:24px; }
.habit-name { font-size:15px; font-weight:600; }
.habit-streak { font-size:12px; color:var(--orange); font-weight:600; }
.habit-check { width:32px; height:32px; border-radius:10px; border:2px solid var(--sep); background:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:all .2s; }
.habit-check.done { background:var(--green); border-color:var(--green); color:#fff; }
.habit-bar { margin-top:10px; height:4px; background:var(--sep); border-radius:2px; overflow:hidden; }
.habit-fill { height:100%; border-radius:2px; transition:width .4s; }
.habit-week { display:flex; gap:4px; margin-top:8px; }
.habit-day { width:12px; height:12px; border-radius:3px; background:var(--sep); }
.habit-day.filled { background:var(--green); }

/* ===== FINANCE ===== */
.finance-summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.fin-card { padding:16px; border-radius:var(--r); color:#fff; }
.fin-val { font-size:24px; font-weight:700; }
.fin-lbl { font-size:11px; opacity:.8; font-weight:600; margin-top:2px; }
.expense-item { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--sep); }
.expense-item:last-child { border:none; }
.exp-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; }
.exp-info { flex:1; }
.exp-name { font-size:14px; font-weight:550; }
.exp-cat { font-size:11px; color:var(--text2); }
.exp-amt { font-size:15px; font-weight:650; }

/* ===== GOALS ===== */
.goal-item { background:var(--card); border-radius:var(--r); padding:16px; margin-bottom:10px; }
.goal-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
.goal-title { font-size:15px; font-weight:600; }
.goal-pct { font-size:14px; font-weight:700; }
.goal-desc { font-size:12px; color:var(--text2); margin-bottom:10px; }
.goal-bar { height:8px; background:var(--sep); border-radius:4px; overflow:hidden; }
.goal-fill { height:100%; border-radius:4px; transition:width .5s; }

/* ===== ANALYTICS ===== */
.chart-card { background:var(--card); border-radius:var(--r); padding:16px; margin-bottom:12px; }
.chart-title { font-size:14px; font-weight:650; margin-bottom:12px; }
.chart-wrap { position:relative; width:100%; height:clamp(180px,30vh,220px); }
.heatmap { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.heat-cell { aspect-ratio:1; border-radius:3px; background:var(--sep); }
.heat-1 { background:rgba(52,199,89,.2); }
.heat-2 { background:rgba(52,199,89,.45); }
.heat-3 { background:rgba(52,199,89,.7); }
.heat-4 { background:var(--green); }
.heat-labels { display:flex; justify-content:space-between; margin-top:6px; }
.heat-labels span { font-size:10px; color:var(--text3); font-weight:600; }

/* ===== SETTINGS ===== */
.setting-row { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--sep); }
.setting-row:last-child { border:none; }
.setting-label { font-size:15px; font-weight:500; }
.toggle { width:51px; height:31px; border-radius:16px; border:none; background:var(--sep); position:relative; cursor:pointer; transition:background .2s; }
.toggle.on { background:var(--green); }
.toggle::after { content:''; width:27px; height:27px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.15); }
.toggle.on::after { transform:translateX(20px); }

/* Sheet */
.sheet-bg { position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.4); display:none; align-items:flex-end; justify-content:center; }
.sheet-bg.open { display:flex; }
.sheet { background:var(--bg); border-radius:20px 20px 0 0; width:100%; max-width:430px; max-height:88vh; overflow-y:auto; animation:slideUp .3s ease; padding-bottom:calc(20px + var(--safe-b)); }
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.sheet-handle { width:36px; height:5px; background:rgba(60,60,67,.2); border-radius:3px; margin:10px auto 0; }
.sheet-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px; }
.sheet-head h2 { font-size:20px; font-weight:700; }
.sheet-x { width:30px; height:30px; border-radius:50%; border:none; background:rgba(118,118,128,.12); color:var(--text2); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.sheet-body { padding:0 20px; }
.f-group { margin-bottom:14px; }
.f-label { font-size:12px; font-weight:600; color:var(--text2); margin-bottom:5px; display:block; text-transform:uppercase; letter-spacing:.3px; }
.f-input { width:100%; padding:11px 14px; font-size:16px; font-family:var(--font); background:var(--card); border:1px solid var(--sep); border-radius:12px; color:var(--text); outline:none; }
.f-input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,122,255,.1); }
textarea.f-input { resize:none; }
.f-seg { display:flex; gap:0; background:rgba(118,118,128,.12); border-radius:10px; padding:2px; }
.f-seg button { flex:1; padding:8px; font-size:12px; font-weight:600; font-family:var(--font); border:none; border-radius:8px; background:none; color:var(--text2); cursor:pointer; }
.f-seg button.active { background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.08); }
.f-cats { display:flex; gap:6px; flex-wrap:wrap; }
.f-cat { padding:6px 12px; border-radius:100px; font-size:12px; font-weight:600; font-family:var(--font); border:2px solid transparent; cursor:pointer; color:#fff; }
.f-cat.sel { box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor; }
.f-sub-list { margin-top:8px; }
.f-sub-row { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
.f-sub-input { flex:1; padding:8px 10px; font-size:13px; font-family:var(--font); background:var(--card); border:1px solid var(--sep); border-radius:8px; color:var(--text); outline:none; }
.f-sub-del { border:none; background:none; color:var(--red); font-size:14px; cursor:pointer; padding:4px; }
.f-sub-add { border:none; background:none; color:var(--blue); font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); padding:4px 0; }
.submit-btn { width:100%; padding:14px; font-size:17px; font-weight:600; font-family:var(--font); background:var(--blue); color:#fff; border:none; border-radius:14px; cursor:pointer; margin:8px 0; }
.submit-btn:active { opacity:.8; }

.toast { position:fixed; top:56px; left:50%; transform:translateX(-50%) translateY(-16px); background:var(--text); color:var(--bg); padding:10px 20px; border-radius:100px; font-size:14px; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:all .3s; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.confetti { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:300; }

.empty-msg { text-align:center; padding:40px 20px; color:var(--text3); }
.empty-msg .em-icon { font-size:40px; margin-bottom:8px; }
.empty-msg p { font-size:14px; }

.more-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.more-item { background:var(--card); border-radius:var(--r); padding:20px 16px; text-align:center; cursor:pointer; transition:transform .15s; border:none; font-family:var(--font); color:var(--text); width:100%; }
.more-item:active { transform:scale(.96); }
.more-icon { font-size:32px; margin-bottom:8px; }
.more-name { font-size:14px; font-weight:600; }

.sub-header { display:flex; align-items:center; gap:12px; padding:52px 0 16px; }
.back-btn { width:36px; height:36px; border-radius:50%; border:none; background:rgba(118,118,128,.12); color:var(--text); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.sub-header h1 { font-size:28px; font-weight:700; }

@media print {
  .bottom-nav,.fab,.sheet-bg,.toast { display:none!important; }
  .screen { display:block!important; break-before:page; }
  body { background:#fff; }
}
</style>
</head>
<body>

<!-- SCREENS -->
<div class="screen active" id="s-home"></div>
<div class="screen" id="s-tasks"></div>
<div class="screen" id="s-focus"></div>
<div class="screen" id="s-habits"></div>
<div class="screen" id="s-more"></div>
<div class="screen" id="s-finance"></div>
<div class="screen" id="s-goals"></div>
<div class="screen" id="s-analytics"></div>
<div class="screen" id="s-settings"></div>

<!-- Nav -->
<nav class="bottom-nav" id="nav">
  <button class="nav-item active" onclick="go('home')"><span class="nav-icon">🏠</span>Home</button>
  <button class="nav-item" onclick="go('tasks')"><span class="nav-icon">✅</span>Tasks</button>
  <button class="nav-item" onclick="go('focus')"><span class="nav-icon">🔥</span>Focus</button>
  <button class="nav-item" onclick="go('habits')"><span class="nav-icon">💪</span>Habits</button>
  <button class="nav-item" onclick="go('more')"><span class="nav-icon">☰</span>More</button>
</nav>

<button class="fab" id="fab" onclick="openTaskSheet()">+</button>

<!-- Task Sheet -->
<div class="sheet-bg" id="taskSheet" onclick="if(event.target===this)closeTaskSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2 id="tsTitle">New Task</h2><button class="sheet-x" onclick="closeTaskSheet()">&times;</button></div>
    <div class="sheet-body">
      <div class="f-group"><label class="f-label">Task</label><input class="f-input" id="tsInpTitle" placeholder="What do you need to do?" /></div>
      <div class="f-group"><label class="f-label">Notes</label><textarea class="f-input" id="tsInpNotes" rows="2" placeholder="Details..."></textarea></div>
      <div class="f-group"><label class="f-label">Due Date</label><input type="date" class="f-input" id="tsInpDate" /></div>
      <div class="f-group"><label class="f-label">Priority</label>
        <div class="f-seg" id="tsPriSeg"></div>
      </div>
      <div class="f-group"><label class="f-label">Category</label>
        <div class="f-cats" id="tsCatSel"></div>
      </div>
      <div class="f-group"><label class="f-label">Subtasks</label>
        <div class="f-sub-list" id="tsSubList"></div>
        <button class="f-sub-add" onclick="addSubField()">+ Add subtask</button>
      </div>
      <button class="submit-btn" id="tsSubmit" onclick="submitTask()">Add Task</button>
    </div>
  </div>
</div>

<!-- Expense Sheet -->
<div class="sheet-bg" id="expSheet" onclick="if(event.target===this)closeExpSheet()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>Add Expense</h2><button class="sheet-x" onclick="closeExpSheet()">&times;</button></div>
    <div class="sheet-body">
      <div class="f-group"><label class="f-label">Item</label><input class="f-input" id="expName" placeholder="What did you spend on?" /></div>
      <div class="f-group"><label class="f-label">Amount (₹)</label><input type="number" class="f-input" id="expAmt" placeholder="0" /></div>
      <div class="f-group"><label class="f-label">Category</label>
        <div class="f-seg" id="expCatSeg"></div>
      </div>
      <button class="submit-btn" onclick="submitExpense()">Add Expense</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas class="confetti" id="confetti"></canvas>

<script>
/* ========== DATA ========== */
const CATS = [
  {id:'work',name:'Work',color:'#ff9500'},
  {id:'study',name:'Study',color:'#af52de'},
  {id:'personal',name:'Personal',color:'#007aff'},
  {id:'health',name:'Health',color:'#ff2d55'},
  {id:'shopping',name:'Shopping',color:'#34c759'},
  {id:'finance',name:'Finance',color:'#5ac8fa'},
];

const EXP_CATS = ['Food','Transport','Shopping','Bills','Entertainment','Health','Other'];

const DEFAULT_TASKS = [
  {id:'t1',title:'Morning workout',notes:'30 min cardio',done:false,pri:'high',cat:'health',date:'2026-05-30',subs:[{t:'Push-ups 3x15',d:false},{t:'Running 20 min',d:false}],created:Date.now()},
  {id:'t2',title:'Complete project proposal',notes:'Include budget and timeline',done:false,pri:'high',cat:'work',date:'2026-06-02',subs:[],created:Date.now()-1e3},
  {id:'t3',title:'Study DSA Chapter 4',notes:'Trees and Graphs',done:false,pri:'high',cat:'study',date:'2026-05-31',subs:[{t:'Read theory',d:false},{t:'Solve 5 problems',d:false}],created:Date.now()-2e3},
  {id:'t4',title:'Buy groceries',notes:'Veggies, fruits, milk',done:false,pri:'medium',cat:'shopping',date:'2026-05-31',subs:[{t:'Tomatoes',d:false},{t:'Spinach',d:false},{t:'Milk',d:false}],created:Date.now()-3e3},
  {id:'t5',title:'Review monthly budget',notes:'',done:false,pri:'medium',cat:'finance',date:'2026-06-01',subs:[],created:Date.now()-4e3},
  {id:'t6',title:'Read 30 pages',notes:'Current book',done:false,pri:'low',cat:'personal',date:'',subs:[],created:Date.now()-5e3},
  {id:'t7',title:'Call dentist',notes:'',done:true,pri:'medium',cat:'health',date:'2026-05-28',subs:[],created:Date.now()-6e3},
  {id:'t8',title:'Update resume',notes:'Add recent projects',done:true,pri:'medium',cat:'work',date:'2026-05-27',subs:[],created:Date.now()-7e3},
];

const DEFAULT_HABITS = [
  {id:'h1',name:'Drink 8 glasses water',icon:'💧',color:'#5ac8fa',streak:7,week:[1,1,1,1,1,1,0],today:false},
  {id:'h2',name:'Morning exercise',icon:'🏋️',color:'#ff2d55',streak:5,week:[1,1,0,1,1,1,0],today:false},
  {id:'h3',name:'Read 30 minutes',icon:'📚',color:'#af52de',streak:12,week:[1,1,1,1,1,1,0],today:false},
  {id:'h4',name:'Meditate',icon:'🧘',color:'#34c759',streak:3,week:[0,1,0,1,1,0,0],today:false},
  {id:'h5',name:'No junk food',icon:'🥗',color:'#ff9500',streak:9,week:[1,1,1,1,0,1,0],today:false},
  {id:'h6',name:'Sleep by 11 PM',icon:'😴',color:'#5856d6',streak:4,week:[1,0,1,1,1,0,0],today:false},
];

const DEFAULT_EXPENSES = [
  {id:'e1',name:'Lunch',amt:180,cat:'Food',date:'2026-05-30'},
  {id:'e2',name:'Auto fare',amt:75,cat:'Transport',date:'2026-05-30'},
  {id:'e3',name:'Netflix',amt:199,cat:'Entertainment',date:'2026-05-29'},
  {id:'e4',name:'Groceries',amt:450,cat:'Shopping',date:'2026-05-29'},
  {id:'e5',name:'Coffee',amt:120,cat:'Food',date:'2026-05-30'},
];

const DEFAULT_GOALS = [
  {id:'g1',title:'Save ₹1,00,000',desc:'Emergency fund target',pct:72,color:'#34c759'},
  {id:'g2',title:'Complete DSA course',desc:'450 problems solved',pct:45,color:'#af52de'},
  {id:'g3',title:'Run 5K under 25 min',desc:'Current: 28 min',pct:60,color:'#ff2d55'},
  {id:'g4',title:'Read 24 books this year',desc:'14 books done',pct:58,color:'#007aff'},
];

const ACHIEVEMENTS = [
  {icon:'🔥',name:'7-Day Streak',req:s=>s.streak>=7},
  {icon:'⚡',name:'10 Tasks Done',req:s=>s.tasksDone>=10},
  {icon:'🧘',name:'5 Focus Hrs',req:s=>s.focusMins>=300},
  {icon:'💎',name:'All Habits',req:s=>s.habitsToday>=6},
  {icon:'🏆',name:'Level 5',req:s=>s.level>=5},
  {icon:'📚',name:'Bookworm',req:s=>s.tasksDone>=25},
  {icon:'💰',name:'Saver',req:s=>s.streak>=14},
  {icon:'🌟',name:'Perfectionist',req:s=>s.tasksDone>=50},
];

let tasks=[],habits=[],expenses=[],goals=[];
let xp=0,level=1,streak=0,focusMins=0,tasksDone=0;
let curScreen='home',tFilter='all',editTaskId=null;
let selPri='medium',selCat='work',subFields=[];
let timerState='idle',timerMode='work',timerSec=25*60,timerInterval=null;
let selExpCat='Food',darkMode=false;
let idC=500,weeklyChart=null;

function loadAll(){
  tasks=JSON.parse(localStorage.getItem('pk_tasks')||'null')||[...DEFAULT_TASKS];
  habits=JSON.parse(localStorage.getItem('pk_habits')||'null')||DEFAULT_HABITS.map(h=>({...h}));
  expenses=JSON.parse(localStorage.getItem('pk_expenses')||'null')||[...DEFAULT_EXPENSES];
  goals=JSON.parse(localStorage.getItem('pk_goals')||'null')||[...DEFAULT_GOALS];
  const g=JSON.parse(localStorage.getItem('pk_game')||'null');
  if(g){xp=g.xp;level=g.level;streak=g.streak;focusMins=g.focusMins;tasksDone=g.tasksDone;}
  else{xp=320;level=3;streak=14;focusMins=180;tasksDone=12;}
  darkMode=localStorage.getItem('pk_dark')==='true';
  if(darkMode)document.documentElement.setAttribute('data-theme','dark');
}
function saveAll(){
  localStorage.setItem('pk_tasks',JSON.stringify(tasks));
  localStorage.setItem('pk_habits',JSON.stringify(habits));
  localStorage.setItem('pk_expenses',JSON.stringify(expenses));
  localStorage.setItem('pk_goals',JSON.stringify(goals));
  localStorage.setItem('pk_game',JSON.stringify({xp,level,streak,focusMins,tasksDone}));
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function catObj(id){return CATS.find(c=>c.id===id)||CATS[0];}
function today(){return new Date().toISOString().split('T')[0];}

/* ========== NAV ========== */
function go(s){
  curScreen=s;
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('s-'+s).classList.add('active');
  document.querySelectorAll('.nav-item').forEach((b,i)=>{
    const ids=['home','tasks','focus','habits','more'];
    b.classList.toggle('active',ids[i]===s);
  });
  const fab=document.getElementById('fab');
  fab.style.display=(s==='tasks'||s==='home')?'flex':'none';
  renderScreen(s);
}
function goSub(s){
  curScreen=s;
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  document.getElementById('s-'+s).classList.add('active');
  document.getElementById('fab').style.display=s==='finance'?'none':'none';
  renderScreen(s);
}

/* ========== RENDER ========== */
function renderScreen(s){
  if(s==='home')renderHome();
  else if(s==='tasks')renderTasks();
  else if(s==='focus')renderFocus();
  else if(s==='habits')renderHabits();
  else if(s==='more')renderMore();
  else if(s==='finance')renderFinance();
  else if(s==='goals')renderGoals();
  else if(s==='analytics')renderAnalytics();
  else if(s==='settings')renderSettings();
}

/* ----- HOME ----- */
function renderHome(){
  const el=document.getElementById('s-home');
  const h=new Date().getHours();
  const greet=h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening';
  const todayTasks=tasks.filter(t=>!t.done);
  const doneTasks=tasks.filter(t=>t.done);
  const todayExp=expenses.filter(e=>e.date===today()).reduce((s,e)=>s+e.amt,0);
  const xpNeeded=level*200;
  const xpPct=Math.min(100,Math.round((xp%xpNeeded)/(xpNeeded)*100));
  const habDone=habits.filter(h=>h.today).length;

  const achState={streak,tasksDone,focusMins,habitsToday:habDone,level};

  el.innerHTML=`
    <div class="greeting"><h1>${greet}, Sachin 👋</h1><p>${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</p></div>
    <div class="level-bar">
      <div class="level-info"><span class="level-label">Level ${level} — ${['Beginner','Starter','Achiever','Warrior','Champion','Legend','Master'][Math.min(level-1,6)]}</span><span class="level-xp">${xp%xpNeeded}/${xpNeeded} XP</span></div>
      <div class="xp-bar"><div class="xp-fill" style="width:${xpPct}%"></div></div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val" style="color:var(--blue)">${todayTasks.length}</div><div class="stat-lbl">Active Tasks</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--green)">${doneTasks.length}</div><div class="stat-lbl">Completed</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--orange)">₹${todayExp.toLocaleString()}</div><div class="stat-lbl">Today's Spend</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--purple)">${habDone}/${habits.length}</div><div class="stat-lbl">Habits Done</div></div>
    </div>
    <div class="streak-card">
      <div><div class="streak-num">${streak}</div></div>
      <div><div class="streak-text">Day Streak 🔥</div><div class="streak-sub">Keep going! You're on fire!</div></div>
    </div>
    <div class="section-title">Today's Tasks</div>
    <div class="card quick-tasks">${todayTasks.slice(0,5).map(t=>{
      const c=catObj(t.cat);
      return `<div class="qt-item"><div class="qt-check${t.done?' done':''}" onclick="toggleTask('${t.id}')"></div><span class="qt-title${t.done?' done-text':''}">${esc(t.title)}</span><div class="qt-pri" style="background:${t.pri==='high'?'var(--red)':t.pri==='medium'?'var(--orange)':'var(--teal)'}"></div></div>`;
    }).join('')}${todayTasks.length===0?'<div class="empty-msg"><p>All tasks done! 🎉</p></div>':''}</div>
    <div class="section-title">Achievements</div>
    <div class="achievements">${ACHIEVEMENTS.map(a=>{
      const unlocked=a.req(achState);
      return `<div class="ach-badge${unlocked?'':' locked'}"><div class="ach-icon">${a.icon}</div><div class="ach-name">${a.name}</div></div>`;
    }).join('')}</div>
  `;
}

/* ----- TASKS ----- */
function renderTasks(){
  const el=document.getElementById('s-tasks');
  const filtered=tasks.filter(t=>{
    if(tFilter==='active')return !t.done;
    if(tFilter==='done')return t.done;
    return true;
  });
  const active=filtered.filter(t=>!t.done).sort((a,b)=>{
    const pw={urgent:0,high:1,medium:2,low:3};
    return(pw[a.pri]||2)-(pw[b.pri]||2);
  });
  const done=filtered.filter(t=>t.done);
  const td=today();

  el.innerHTML=`
    <div style="padding-top:52px"><div class="section-title">Tasks</div></div>
    <div class="task-filters">
      <button class="tf-btn${tFilter==='all'?' active':''}" onclick="setTF('all')">All (${tasks.length})</button>
      <button class="tf-btn${tFilter==='active'?' active':''}" onclick="setTF('active')">Active (${tasks.filter(t=>!t.done).length})</button>
      <button class="tf-btn${tFilter==='done'?' active':''}" onclick="setTF('done')">Done (${tasks.filter(t=>t.done).length})</button>
    </div>
    ${active.map(t=>taskItemHTML(t,td)).join('')}
    ${done.length>0&&tFilter!=='active'?`<div style="font-size:13px;font-weight:650;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:12px 0 6px">Completed</div>`:''}
    ${done.map(t=>taskItemHTML(t,td)).join('')}
    ${filtered.length===0?'<div class="empty-msg"><div class="em-icon">✨</div><p>No tasks here</p></div>':''}
  `;
}

function taskItemHTML(t,td){
  const c=catObj(t.cat);
  const overdue=!t.done&&t.date&&t.date<td;
  let dateStr='';
  if(t.date){
    if(t.date===td)dateStr='Today';
    else{const tmr=new Date();tmr.setDate(tmr.getDate()+1);if(t.date===tmr.toISOString().split('T')[0])dateStr='Tomorrow';else dateStr=new Date(t.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});}
  }
  const priColor=t.pri==='urgent'?'var(--pink)':t.pri==='high'?'var(--red)':t.pri==='medium'?'var(--orange)':'var(--teal)';
  const subsHTML=t.subs&&t.subs.length?`<div class="subtasks">${t.subs.map((s,i)=>`<div class="sub-item"><div class="sub-check${s.d?' done':''}" onclick="toggleSub('${t.id}',${i})"></div><span class="sub-title${s.d?' done-t':''}">${esc(s.t)}</span></div>`).join('')}</div>`:'';

  return `<div class="task-item${t.done?' completed':''}">
    <div class="t-pri-bar" style="background:${priColor}"></div>
    <div class="t-check${t.done?' done':''}" onclick="toggleTask('${t.id}')"></div>
    <div class="t-body" onclick="openEditTask('${t.id}')">
      <div class="t-title">${esc(t.title)}</div>
      ${t.notes?`<div class="t-notes">${esc(t.notes)}</div>`:''}
      <div class="t-meta">
        <span class="t-cat" style="background:${c.color}">${c.name}</span>
        ${t.pri==='urgent'?'<span class="badge" style="background:rgba(255,45,85,.1);color:var(--pink)">🚨 Urgent</span>':''}
        ${dateStr?`<span class="t-due${overdue?' overdue':''}">${overdue?'⚠ ':''}${dateStr}</span>`:''}
      </div>
      ${subsHTML}
    </div>
    <button class="t-del" onclick="deleteTask('${t.id}')">✕</button>
  </div>`;
}

function setTF(f){tFilter=f;renderTasks();}
function toggleTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  if(t.done){xp+=20;tasksDone++;checkLevelUp();toast('Task completed! +20 XP');fireConfetti();}
  else{toast('Task reopened');}
  saveAll();renderScreen(curScreen);
}
function toggleSub(tid,si){
  const t=tasks.find(x=>x.id===tid);if(!t||!t.subs[si])return;
  t.subs[si].d=!t.subs[si].d;
  if(t.subs[si].d){xp+=5;checkLevelUp();}
  saveAll();renderScreen(curScreen);
}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);saveAll();renderScreen(curScreen);toast('Task deleted');}

/* Task Sheet */
function openTaskSheet(){
  editTaskId=null;selPri='medium';selCat='work';subFields=[];
  document.getElementById('tsTitle').textContent='New Task';
  document.getElementById('tsSubmit').textContent='Add Task';
  document.getElementById('tsInpTitle').value='';
  document.getElementById('tsInpNotes').value='';
  document.getElementById('tsInpDate').value='';
  renderTaskSheetForm();
  document.getElementById('taskSheet').classList.add('open');
  setTimeout(()=>document.getElementById('tsInpTitle').focus(),200);
}
function openEditTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  editTaskId=id;selPri=t.pri;selCat=t.cat;subFields=t.subs?t.subs.map(s=>s.t):[];
  document.getElementById('tsTitle').textContent='Edit Task';
  document.getElementById('tsSubmit').textContent='Save';
  document.getElementById('tsInpTitle').value=t.title;
  document.getElementById('tsInpNotes').value=t.notes||'';
  document.getElementById('tsInpDate').value=t.date||'';
  renderTaskSheetForm();
  document.getElementById('taskSheet').classList.add('open');
}
function closeTaskSheet(){document.getElementById('taskSheet').classList.remove('open');editTaskId=null;}
function renderTaskSheetForm(){
  const pris=['low','medium','high','urgent'];
  document.getElementById('tsPriSeg').innerHTML=pris.map(p=>`<button class="${p===selPri?'active':''}" data-p="${p}" onclick="selPri='${p}';renderTaskSheetForm()">${p[0].toUpperCase()+p.slice(1)}</button>`).join('');
  document.getElementById('tsCatSel').innerHTML=CATS.map(c=>`<button class="f-cat${c.id===selCat?' sel':''}" style="background:${c.color}" onclick="selCat='${c.id}';renderTaskSheetForm()">${c.name}</button>`).join('');
  document.getElementById('tsSubList').innerHTML=subFields.map((s,i)=>`<div class="f-sub-row"><input class="f-sub-input" value="${esc(s)}" onchange="subFields[${i}]=this.value" placeholder="Subtask..." /><button class="f-sub-del" onclick="subFields.splice(${i},1);renderTaskSheetForm()">✕</button></div>`).join('');
}
function addSubField(){subFields.push('');renderTaskSheetForm();const ins=document.querySelectorAll('.f-sub-input');if(ins.length)ins[ins.length-1].focus();}
function submitTask(){
  const title=document.getElementById('tsInpTitle').value.trim();if(!title)return document.getElementById('tsInpTitle').focus();
  const notes=document.getElementById('tsInpNotes').value.trim();
  const date=document.getElementById('tsInpDate').value;
  const subs=subFields.filter(s=>s.trim()).map(s=>({t:s.trim(),d:false}));
  if(editTaskId){
    const t=tasks.find(x=>x.id===editTaskId);
    if(t){t.title=title;t.notes=notes;t.date=date;t.pri=selPri;t.cat=selCat;t.subs=subs;}
    toast('Task updated');
  } else {
    tasks.unshift({id:'c'+(++idC),title,notes,date,done:false,pri:selPri,cat:selCat,subs,created:Date.now()});
    xp+=10;checkLevelUp();toast('Task added! +10 XP');
  }
  saveAll();closeTaskSheet();renderScreen(curScreen);
}

/* ----- FOCUS ----- */
const TIMER_MODES={work:25*60,short:5*60,long:15*60};
function renderFocus(){
  const el=document.getElementById('s-focus');
  const circumference=2*Math.PI*108;
  const maxSec=TIMER_MODES[timerMode];
  const progress=(maxSec-timerSec)/maxSec;
  const offset=circumference*(1-progress);
  const min=Math.floor(timerSec/60);
  const sec=timerSec%60;
  const sessions=Math.floor(focusMins/25);
  const fColor=timerMode==='work'?'var(--red)':timerMode==='short'?'var(--green)':'var(--blue)';

  el.innerHTML=`
    <div style="padding-top:52px;text-align:center"><div class="section-title" style="text-align:center">Focus Mode</div></div>
    <div class="timer-modes">
      <button class="tm-btn${timerMode==='work'?' active':''}" onclick="setTimerMode('work')">Work 25m</button>
      <button class="tm-btn${timerMode==='short'?' active':''}" onclick="setTimerMode('short')">Break 5m</button>
      <button class="tm-btn${timerMode==='long'?' active':''}" onclick="setTimerMode('long')">Long 15m</button>
    </div>
    <div class="timer-ring">
      <svg viewBox="0 0 240 240"><circle class="timer-bg" cx="120" cy="120" r="108"/><circle class="timer-fg" cx="120" cy="120" r="108" style="stroke:${fColor};stroke-dasharray:${circumference};stroke-dashoffset:${offset}"/></svg>
      <div class="timer-text"><div class="timer-time">${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}</div><div class="timer-label">${timerMode==='work'?'Focus Time':timerMode==='short'?'Short Break':'Long Break'}</div></div>
    </div>
    <div class="timer-controls">
      ${timerState==='idle'?`<button class="timer-btn primary" onclick="startTimer()">Start</button>`:''}
      ${timerState==='running'?`<button class="timer-btn danger" onclick="pauseTimer()">Pause</button>`:''}
      ${timerState==='paused'?`<button class="timer-btn primary" onclick="resumeTimer()">Resume</button><button class="timer-btn secondary" onclick="resetTimer()">Reset</button>`:''}
    </div>
    <div class="focus-stats">
      <div class="stat-box"><div class="stat-val" style="color:var(--red)">${sessions}</div><div class="stat-lbl">Sessions</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--orange)">${focusMins}m</div><div class="stat-lbl">Focus Time</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--green)">${Math.round(focusMins/60*10)/10}h</div><div class="stat-lbl">Total Hours</div></div>
    </div>
  `;
}
function setTimerMode(m){if(timerState==='running')return;timerMode=m;timerSec=TIMER_MODES[m];timerState='idle';renderFocus();}
function startTimer(){timerState='running';timerInterval=setInterval(tickTimer,1000);renderFocus();}
function pauseTimer(){timerState='paused';clearInterval(timerInterval);renderFocus();}
function resumeTimer(){timerState='running';timerInterval=setInterval(tickTimer,1000);renderFocus();}
function resetTimer(){timerState='idle';clearInterval(timerInterval);timerSec=TIMER_MODES[timerMode];renderFocus();}
function tickTimer(){
  timerSec--;
  if(timerSec<=0){
    clearInterval(timerInterval);timerState='idle';
    if(timerMode==='work'){focusMins+=25;xp+=30;checkLevelUp();toast('Session complete! +30 XP 🎉');fireConfetti();}
    else toast('Break over! Ready to focus?');
    timerSec=TIMER_MODES[timerMode];saveAll();
  }
  if(curScreen==='focus')renderFocus();
}

/* ----- HABITS ----- */
function renderHabits(){
  const el=document.getElementById('s-habits');
  const done=habits.filter(h=>h.today).length;
  el.innerHTML=`
    <div style="padding-top:52px"><div class="section-title">Daily Habits</div></div>
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div><div style="font-size:14px;font-weight:600">Today's Progress</div><div style="font-size:12px;color:var(--text2)">${done} of ${habits.length} completed</div></div>
      <div style="font-size:24px;font-weight:700;color:${done===habits.length?'var(--green)':'var(--orange)'}">${Math.round(done/habits.length*100)}%</div>
    </div>
    ${habits.map(h=>`
      <div class="habit-item">
        <div class="habit-top">
          <div class="habit-info"><span class="habit-icon">${h.icon}</span><div><div class="habit-name">${esc(h.name)}</div><div class="habit-streak">🔥 ${h.streak} day streak</div></div></div>
          <button class="habit-check${h.today?' done':''}" onclick="toggleHabit('${h.id}')">${h.today?'✓':''}</button>
        </div>
        <div class="habit-week">${['M','T','W','T','F','S','S'].map((d,i)=>`<div class="habit-day${h.week[i]?' filled':''}" title="${d}"></div>`).join('')}</div>
      </div>
    `).join('')}
  `;
}
function toggleHabit(id){
  const h=habits.find(x=>x.id===id);if(!h)return;
  h.today=!h.today;
  if(h.today){h.streak++;xp+=15;checkLevelUp();toast(`${h.name} done! +15 XP`);}
  else{h.streak=Math.max(0,h.streak-1);}
  const allDone=habits.every(h=>h.today);
  if(allDone){xp+=50;checkLevelUp();toast('All habits done! +50 XP 🏆');fireConfetti();}
  saveAll();renderHabits();if(curScreen==='home')renderHome();
}

/* ----- MORE ----- */
function renderMore(){

/* ----- FINANCE ----- */
function renderFinance(){
  const el=document.getElementById('s-finance');
  const td=today();
  const todayExp=expenses.filter(e=>e.date===td);
  const todayTotal=todayExp.reduce((s,e)=>s+e.amt,0);
  const monthTotal=expenses.reduce((s,e)=>s+e.amt,0);
  const catIcons={Food:'🍽️',Transport:'🚗',Shopping:'🛍️',Bills:'📄',Entertainment:'🎬',Health:'💊',Other:'📦'};

  el.innerHTML=`
    <div class="sub-header"><button class="back-btn" onclick="go('more')">←</button><h1>Finance</h1></div>
    <div class="finance-summary">
      <div class="fin-card" style="background:linear-gradient(135deg,#007aff,#5856d6)"><div class="fin-val">₹${todayTotal.toLocaleString()}</div><div class="fin-lbl">Today's Spending</div></div>
      <div class="fin-card" style="background:linear-gradient(135deg,#ff9500,#ff2d55)"><div class="fin-val">₹${monthTotal.toLocaleString()}</div><div class="fin-lbl">This Month</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="section-title" style="margin:0">Recent</div>
      <button style="background:var(--blue);color:#fff;border:none;border-radius:100px;padding:8px 16px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer" onclick="openExpSheet()">+ Add</button>
    </div>
    <div class="card">${expenses.slice(0,10).map(e=>`
      <div class="expense-item">
        <div class="exp-icon" style="background:rgba(0,122,255,.08)">${catIcons[e.cat]||'📦'}</div>
        <div class="exp-info"><div class="exp-name">${esc(e.name)}</div><div class="exp-cat">${e.cat} · ${new Date(e.date+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>
        <div class="exp-amt" style="color:var(--red)">-₹${e.amt.toLocaleString()}</div>
      </div>
    `).join('')}</div>
  `;
}
function openExpSheet(){selExpCat='Food';renderExpForm();document.getElementById('expSheet').classList.add('open');setTimeout(()=>document.getElementById('expName').focus(),200);}
function closeExpSheet(){document.getElementById('expSheet').classList.remove('open');}
function renderExpForm(){
  document.getElementById('expCatSeg').innerHTML=EXP_CATS.slice(0,4).map(c=>`<button class="${c===selExpCat?'active':''}" onclick="selExpCat='${c}';renderExpForm()">${c}</button>`).join('');
}
function submitExpense(){
  const name=document.getElementById('expName').value.trim();
  const amt=parseFloat(document.getElementById('expAmt').value);
  if(!name||!amt)return;
  expenses.unshift({id:'e'+(++idC),name,amt,cat:selExpCat,date:today()});
  saveAll();closeExpSheet();renderFinance();toast('Expense added');
}

/* ----- ANALYTICS ----- */
function renderAnalytics(){
  const el=document.getElementById('s-analytics');
  const done=tasks.filter(t=>t.done).length;
  const total=tasks.length;
  const pct=total?Math.round(done/total*100):0;

  el.innerHTML=`
    <div class="sub-header"><button class="back-btn" onclick="go('more')">←</button><h1>Analytics</h1></div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val" style="color:var(--green)">${pct}%</div><div class="stat-lbl">Completion</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--purple)">${Math.round(focusMins/60*10)/10}h</div><div class="stat-lbl">Focus Time</div></div>
    </div>
    <div class="chart-card"><div class="chart-title">Weekly Activity</div><div class="chart-wrap"><canvas id="weeklyCanvas"></canvas></div></div>
    <div class="chart-card"><div class="chart-title">Completion Heatmap (last 28 days)</div>
      <div class="heat-labels"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>
      <div class="heatmap" style="margin-top:6px">${Array.from({length:28},()=>{const v=Math.floor(Math.random()*5);return `<div class="heat-cell${v?' heat-'+v:''}"></div>`;}).join('')}</div>
    </div>
    <div class="chart-card"><div class="chart-title">Tasks by Category</div><div class="chart-wrap"><canvas id="catCanvas"></canvas></div></div>
  `;

  setTimeout(()=>{
    const wCtx=document.getElementById('weeklyCanvas');
    if(wCtx){
      if(weeklyChart)weeklyChart.destroy();
      const isDark=darkMode;
      weeklyChart=new Chart(wCtx,{
        type:'bar',
        data:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],datasets:[{label:'Tasks Done',data:[3,5,2,4,6,1,2],backgroundColor:'rgba(0,122,255,0.6)',borderRadius:8,borderSkipped:false},{label:'Focus (sessions)',data:[2,3,1,2,4,0,1],backgroundColor:'rgba(175,82,222,0.5)',borderRadius:8,borderSkipped:false}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:isDark?'#fff':'#1c1c1e',font:{size:11,weight:'600'}}}},scales:{x:{grid:{display:false},ticks:{color:isDark?'#98989f':'#8e8e93',font:{size:11}}},y:{grid:{color:isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.05)'},ticks:{color:isDark?'#98989f':'#8e8e93',font:{size:11}}}}}
      });
    }
    const cCtx=document.getElementById('catCanvas');
    if(cCtx){
      const catCounts=CATS.map(c=>tasks.filter(t=>t.cat===c.id).length);
      new Chart(cCtx,{
        type:'doughnut',
        data:{labels:CATS.map(c=>c.name),datasets:[{data:catCounts,backgroundColor:CATS.map(c=>c.color),borderWidth:0}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'bottom',labels:{color:darkMode?'#fff':'#1c1c1e',font:{size:11,weight:'600'},padding:12,usePointStyle:true,pointStyleWidth:8}}}}
      });
    }
  },50);
}

function checkLevelUp(){
  const needed=level*200;
  if(xp>=needed){xp-=needed;level++;toast(`🎉 Level Up! You're now Level ${level}!`);fireConfetti();}
}

/* ========== CONFETTI ========== */
function fireConfetti(){
  const canvas=document.getElementById('confetti');
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const particles=[];
  const colors=['#ff3b30','#ff9500','#ffcc00','#34c759','#007aff','#af52de','#ff2d55'];
  for(let i=0;i<80;i++){
    particles.push({x:canvas.width/2,y:canvas.height/2,vx:(Math.random()-.5)*12,vy:Math.random()*-14-4,size:Math.random()*8+4,color:colors[Math.floor(Math.random()*colors.length)],rotation:Math.random()*360,rotSpeed:(Math.random()-.5)*10,life:1});
  }
  let frame=0;
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    particles.forEach(p=>{
      if(p.life<=0)return;
      alive=true;p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.rotation+=p.rotSpeed;p.life-=.012;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rotation*Math.PI/180);
      ctx.fillStyle=p.color;ctx.globalAlpha=p.life;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      ctx.restore();
    });
    if(alive&&frame<120){frame++;requestAnimationFrame(animate);}
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  animate();
}

/* ========== UTILS ========== */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
